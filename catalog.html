<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dr. Brezel Gourmet | Коллекция</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Syne:wght@700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/catalog.css"> <!-- Новый файл для каталога -->
</head>
<body>

<header class="header">
    <div class="container header__inner">
        <a href="index.html" class="header__logo">Dr. Brezel <span>Gourmet</span></a>
        <nav class="header__nav">
            <a href="catalog.html" style="color: var(--accent);">Коллекция</a>
            <a href="about.html">О бренде</a>
        </nav>
        <!-- Динамический блок -->
        <div class="header__auth-buttons" id="auth-buttons" style="display: flex; gap: 15px; align-items: center;"></div>
        <button class="burger" id="burger-btn" aria-label="Меню">
            <span></span><span></span><span></span>
        </button>
    </div>
    <div class="mobile-menu" id="mobile-menu">
        <a href="catalog.html">Коллекция</a>
        <a href="about.html">О бренде</a>
        <button class="header__btn" onclick="window.location.href='index.html#lead-form'">Оставить заявку</button>
    </div>
</header>

    <main class="catalog-page">
        
        <!-- ЗАГОЛОВОК И ПОИСК -->
        <section class="catalog-hero">
            <div class="container">
                <h1 class="reveal">Наша <span>коллекция</span></h1>
                
                <div class="search-bar reveal">
                    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="search-input" placeholder="Поиск по названию...">
                    <button id="filter-toggle-btn" class="filter-icon-btn" aria-label="Фильтры">
                        <svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                    </button>
                </div>

                <!-- Быстрые фильтры (категории) -->
                <div class="catalog-filters reveal">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="cheese">Сыры</button>
                    <button class="filter-btn" data-filter="brezel">Брецели</button>
                    <button class="filter-btn" data-filter="butter">Масла</button>
                    <button class="filter-btn" data-filter="set">Наборы</button>
                </div>

                <!-- Панель расширенных фильтров (скрыта по умолчанию) -->
                <div class="advanced-filters" id="advanced-filters">
                    <div class="filter-group">
                        <label>Сортировка:</label>
                        <select id="sort-select">
                            <option value="default">По умолчанию</option>
                            <option value="price-asc">Цена: по возрастанию</option>
                            <option value="price-desc">Цена: по убыванию</option>
                            <option value="name-asc">Название: А-Я</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Цена до:</label>
                        <input type="range" id="price-range" min="0" max="5000" step="100" value="5000">
                        <span id="price-range-value">5000 ₽</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- СЕТКА ТОВАРОВ -->
        <section class="catalog-grid container" id="product-grid">
            <!-- Товары будут рендериться через JS -->
        </section>

        <!-- СООБЩЕНИЕ "НИЧЕГО НЕ НАЙДЕНО" -->
        <div class="no-results" id="no-results" style="display: none;">
            <h2>Ничего не найдено</h2>
            <p>Попробуйте изменить параметры поиска.</p>
        </div>

        <!-- ПРИЗЫВ -->
        <section class="catalog-cta reveal">
            <div class="container">
                <h2>Не нашли то, что искали?</h2>
                <p>Оставьте заявку, и Доктор Брезель лично подберет для вас идеальную сырную тарелку.</p>
                <a href="index.html#lead-form" class="btn">Оставить заявку</a>
            </div>
        </section>

    </main>

    <footer style="padding: 60px 0; border-top: 1px solid var(--border);">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
            <div style="color: var(--text-muted);">© 2026 Dr. Brezel Gourmet</div>
            <div style="display: flex; gap: 20px;">
                <!-- ВК -->
                <a href="https://vk.ru/drbrezelgourmet" target="_blank" aria-label="ВКонтакте" style="color: var(--text-main); transition: color 0.3s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-main)'">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12.785 16.241s.288-.032.436-.191c.136-.146.132-.42.132-.42s-.02-1.283.576-1.472c.588-.186 1.342 1.241 2.142 1.789.606.414 1.065.323 1.065.323l2.142-.03s1.12-.069.589-.949c-.044-.072-.31-.652-1.596-1.848-1.345-1.254-1.164-1.051.455-3.22.986-1.321 1.38-2.128 1.257-2.473-.117-.328-.84-.241-.84-.241l-2.41.015s-.179-.025-.311.055c-.13.078-.213.26-.213.26s-.381 1.015-.889 1.879c-1.071 1.823-1.5 1.919-1.674 1.806-.406-.263-.304-1.059-.304-1.624 0-1.765.267-2.501-.52-2.691-.261-.063-.454-.104-1.124-.111-.86-.009-1.588.003-1.999.206-.274.135-.485.436-.356.453.159.021.519.097.709.356.246.334.237 1.085.237 1.085s.142 2.077-.33 2.334c-.323.176-.767-.183-1.719-1.824-.488-.846-.856-1.781-.856-1.781s-.071-.174-.198-.267c-.153-.113-.367-.149-.367-.149l-2.287.015s-.343.01-.469.159c-.112.132-.009.406-.009.406s1.792 4.192 3.822 6.303c1.86 1.933 3.972 1.806 3.972 1.806h.957z"/></svg>
                </a>
                <!-- Telegram -->
                <a href="https://t.me/drbrezelgourmet" target="_blank" aria-label="Telegram" style="color: var(--text-main); transition: color 0.3s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-main)'">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                </a>
                <!-- Instagram -->
                <a href="https://www.instagram.com/drbrezelgourmet" target="_blank" aria-label="Instagram" style="color: var(--text-main); transition: color 0.3s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-main)'">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zm0 10.162a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
                </a>
            </div>
        </div>
    </footer>

<script type="module" src="js/catalog.js"></script>
</body>
</html>
